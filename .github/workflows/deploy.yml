name: Deploy verification

on:
  push:
    branches: [main]

# Railway deploys on push to main before this runs, so a red check here is a
# signal, not a gate. The gate is the Tests workflow on the pull request.
jobs:
  verify:
    name: Verify what was just deployed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm test
        env:
          NODE_OPTIONS: '--experimental-vm-modules'

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm test
          npm run build

      - name: Remind about migrations
        run: |
          echo "::notice::Migrations are never applied automatically."
          echo "::notice::Run ./scripts/migrate.sh plan production and apply what it lists."
