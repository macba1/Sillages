# ─────────────────────────────────────────────────────────────────────────────
# Sillages — DEVELOPMENT app configuration.
#
# A separate Shopify app, linked only to the development store. It exists so the
# social-gallery product can be exercised end to end without touching the public
# listing.
#
# `shopify.app.toml` is the PUBLIC, PRODUCTION app. Do not edit it, and never run
# `shopify app deploy` or `shopify app dev` without `--config dev`.
#
# `shopify app config link` rewrites this file and strips comments. If that
# happens again, restore this header and re-check the scopes below.
# ─────────────────────────────────────────────────────────────────────────────

client_id = "22dc365ecf72d104affe4e78da39fea3"
name = "Sillages (development)"
application_url = "https://improvement-date-movies-mitsubishi.trycloudflare.com/api/shopify/auth"
embedded = false

[build]
# Let `shopify app dev` register whatever tunnel it creates. Without this the
# app keeps the previous run's URL and OAuth fails with "redirect_uri is not
# whitelisted" — which is exactly what happened on the first install attempt.
automatically_update_urls_on_dev = true

[access_scopes]
# The minimum the social-gallery product actually uses.
#
#   read_products         catalogue: products, variants, images, collections
#   read_inventory        stock, so a sold-out variant is shown as sold out
#   write_pixels          activating the Web Pixel with webPixelCreate. Without
#                         it checkout and purchases are never measured, because
#                         the extension does nothing until the app creates it.
#   read_customer_events  required by Shopify alongside write_pixels
#
# Deliberately NOT requested, unlike the production app: read_all_orders,
# read_customers, write_customers, read_analytics, read_reports, read_pixels,
# write_products, write_discounts, read_checkouts, write_marketing_events.
scopes = "read_products,read_inventory,write_pixels,read_customer_events"
optional_scopes = []
# The backend implements the classic OAuth authorize flow. With managed
# installation (`false`) Shopify grants scopes at install and never whitelists a
# redirect_uri, which is why every install attempt answered
# "Oauth error invalid_request: The redirect_uri is not whitelisted".
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://improvement-date-movies-mitsubishi.trycloudflare.com/api/shopify/callback"
]

[webhooks]
api_version = "2026-01"

  # Mandatory privacy topics. Required even on a development app.
  [[webhooks.subscriptions]]
  uri = "https://improvement-date-movies-mitsubishi.trycloudflare.com/api/webhooks/shopify-compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[pos]
embedded = false
