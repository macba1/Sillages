# ─────────────────────────────────────────────────────────────────────────────
# Sillages — DEVELOPMENT app configuration.
#
# A separate Shopify app, linked only to the development store. It exists so the
# social-gallery product can be exercised end to end without touching the public
# listing.
#
# `shopify.app.toml` is the PUBLIC, PRODUCTION app. Do not edit it, and never run
# `shopify app deploy` or `shopify app dev` without `--config dev`.
#
# `shopify app config link` rewrites this file and strips comments. If that
# happens again, restore this header and re-check the scopes below.
# ─────────────────────────────────────────────────────────────────────────────

client_id = "22dc365ecf72d104affe4e78da39fea3"
name = "Sillages (development)"
application_url = "https://rats-efficient-conf-blonde.trycloudflare.com/api/shopify/auth"
embedded = false

[build]
# Let `shopify app dev` register whatever tunnel it creates. Without this the
# app keeps the previous run's URL and OAuth fails with "redirect_uri is not
# whitelisted" — which is exactly what happened on the first install attempt.
automatically_update_urls_on_dev = true

[access_scopes]
# What this launch actually uses, and nothing else.
#
#   read_products   catalogue: products, variants, images, collections
#   read_inventory  stock, so a sold-out variant is shown as sold out
#
# Both are already granted on the public app, so no installed merchant is
# re-prompted. write_pixels and read_customer_events are deliberately absent:
# checkout measurement is not in this release.
scopes = "read_products,read_inventory"
optional_scopes = []
# Mirrors the public app, which has always used managed installation. An
# earlier run blamed this setting for "redirect_uri is not whitelisted"; the
# actual cause was a stale dev preview on the store, and this is set back to
# false so staging validates the same install path production uses.
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://rats-efficient-conf-blonde.trycloudflare.com/api/shopify/callback"
]

[webhooks]
api_version = "2026-01"

  # Mandatory privacy topics. Required even on a development app.
  [[webhooks.subscriptions]]
  uri = "https://rats-efficient-conf-blonde.trycloudflare.com/api/webhooks/shopify-compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[pos]
embedded = false
