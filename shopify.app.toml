# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "35582656e15f06c81e7e4a9b0f828614"
name = "Sillages"
application_url = "https://sillages-production.up.railway.app/api/shopify/auth"
embedded = false

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "https://sillages-production.up.railway.app/api/webhooks/shopify-compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# Narrowed for the Social Gallery pivot, from twelve scopes to the two the
# product reads:
#
#   read_products   catalogue: products, variants, images, collections
#   read_inventory  stock, so a sold-out variant shows as sold out
#
# Both were already inside every installed merchant's grant, so nobody is
# re-prompted. Removed rather than left in place: asking for permissions the
# product does not read is an App Store review failure and a promise to the
# merchant that is not kept.
#
# Deliberately absent — write_pixels and read_customer_events (checkout
# measurement is not in this release) and read_orders (no revenue attribution).
scopes = "read_products,read_inventory"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://sillages-production.up.railway.app/api/shopify/callback"
]

[pos]
embedded = false
